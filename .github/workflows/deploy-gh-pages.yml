name: Deploy docs to GitHub Pages

# Dual hosting: this site also deploys to Firebase Hosting (site `snap-contact-docs`)
# via `yarn firebase:deploy`. GitHub Pages serves the same build at the custom
# domain in static/CNAME (snap-contact-docs.aoneahsan.com).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack (yarn)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable || yarn install
      - name: Build
        run: yarn build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
